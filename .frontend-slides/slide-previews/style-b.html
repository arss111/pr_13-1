<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Митьен · 46 · 6 декабря</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Кириллические замены: Unbounded вместо Bricolage Grotesque, Literata вместо Fraunces -->
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800;900&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400;1,7..72,500&display=swap" rel="stylesheet">
<style>
/* === THEME (Long Table: одна ржаво-терракотовая краска на сливочной бумаге) === */
:root {
  --paper: #FAF1E2; --paper-d: #F2E5CF; --paper-vd: #E8D7B6;
  --ink: #B53D2A; --ink-dp: #8E2D1F;
  --ink-78: rgba(181,61,42,.78); --ink-32: rgba(181,61,42,.32); --ink-10: rgba(181,61,42,.10);
  --stage-bg: #FAF1E2; --slide-bg: #FAF1E2;
  --font-display: "Unbounded", sans-serif;
  --font-body: "Literata", serif;
  --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
/* ===========================================
   FIXED STAGE: MANDATORY BASE STYLES (viewport-base.css)
   Сцена вертикальная 1080×1920 (по согласованию: приглашение смотрят с телефона).
   Слайды рисуются в 1080×1920 и масштабируются целиком.
   =========================================== */
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-viewport { position: fixed; inset: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; transform-origin: 0 0; background: var(--slide-bg, #fff); }
.slide { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; display: block; visibility: hidden; opacity: 0; pointer-events: none; background: var(--slide-bg, #fff); }
.slide.active, .slide.visible { visibility: visible; opacity: 1; pointer-events: auto; z-index: 1; }
img, video, canvas, svg { max-width: 100%; max-height: 100%; }
.deck-controls { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 1000; }
@media print {
  html, body { width: 1080px; height: auto; overflow: visible; background: #fff; }
  .deck-viewport { position: static; overflow: visible; background: #fff; }
  .deck-stage { position: static; width: auto; height: auto; transform: none !important; background: none; }
  .slide { position: relative; display: block !important; visibility: visible !important; opacity: 1 !important; pointer-events: auto !important; width: 1080px; height: 1920px; break-after: page; page-break-after: always; }
  .slide:last-child { break-after: auto; page-break-after: auto; }
  .deck-controls { display: none !important; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.2s !important; }
}


/* === PAPER TEXTURE: точки 4px === */
.slide::before { content: ""; position: absolute; inset: 0; pointer-events: none;
  background-image: radial-gradient(var(--ink-10) 1px, transparent 1.4px); background-size: 8px 8px; }

/* === LAYOUT === */
.content { position: absolute; inset: 0; padding: 110px 90px 110px; color: var(--ink); display: flex; flex-direction: column; }
.top { display: flex; justify-content: space-between; align-items: center; }
.pill { border: 2px solid var(--ink); border-radius: 999px; padding: 16px 34px; font: italic 500 34px/1 var(--font-body); }
.edition { font: italic 400 34px/1 var(--font-body); color: var(--ink-78); }
.dash { border-top: 2px dashed var(--ink-32); margin: 56px 0; }
.solid { border-top: 2px solid var(--ink); }
.eyebrow { font: italic 400 46px/1.2 var(--font-body); color: var(--ink-78); }
.name { font: 900 150px/.95 var(--font-display); text-transform: uppercase; letter-spacing: -.02em; margin-top: 26px; }
.age-row { display: flex; align-items: flex-end; gap: 36px; margin-top: 10px; }
.age { font: 900 400px/.8 var(--font-display); letter-spacing: -.05em; color: var(--ink); }
.age-note { font: 800 38px/1.15 var(--font-display); text-transform: uppercase; padding-bottom: 34px; }
.lead { font: italic 400 50px/1.4 var(--font-body); margin-top: 50px; max-width: 860px; }
.info { display: grid; grid-template-columns: 1fr 1fr; }
.info > div { padding: 34px 0; }
.info > div + div { border-left: 2px dashed var(--ink-32); padding-left: 40px; }
.info .k { font: italic 400 30px/1 var(--font-body); color: var(--ink-78); }
.info .v { font: 800 52px/1.1 var(--font-display); text-transform: uppercase; margin-top: 16px; }
.info .s { font: italic 400 30px/1.35 var(--font-body); color: var(--ink-78); margin-top: 10px; }
.cta { align-self: center; margin-top: auto; border: 2.5px solid var(--ink); border-radius: 999px; padding: 30px 70px; font: 800 34px/1 var(--font-display); text-transform: uppercase; letter-spacing: .06em; color: var(--paper); background: var(--ink); }

/* === ANIMATIONS: печать на бумаге === */
.reveal { opacity: 0; transform: translateY(36px); transition: opacity .9s var(--ease-out-expo), transform .9s var(--ease-out-expo); }
.slide.visible .reveal { opacity: 1; transform: none; }
.stamp { opacity: 0; transform: scale(1.6) rotate(-8deg); }
.slide.visible .stamp { animation: stamp .7s .9s cubic-bezier(.3,1.6,.5,1) forwards; }
@keyframes stamp { 60% { opacity: 1; transform: scale(.94) rotate(1deg); } 100% { opacity: 1; transform: none; } }
.draw { transform: scaleX(0); transform-origin: left; }
.slide.visible .draw { animation: draw 1.2s var(--ease-out-expo) forwards; }
@keyframes draw { to { transform: scaleX(1); } }
.d1 { transition-delay: .1s; animation-delay: .2s !important; } .d2 { transition-delay: .35s; } .d3 { transition-delay: .55s; }
.d4 { transition-delay: 1.4s; animation-delay: 1.3s !important; } .d5 { transition-delay: 1.7s; } .d6 { transition-delay: 2s; }
.cta.reveal { transition-delay: 2.3s; }
.slide.visible .cta { animation: nudge 2.6s 3.4s ease-in-out infinite; }
@keyframes nudge { 0%, 100% { transform: none; } 50% { transform: translateY(-8px); } }
</style>
</head>
<body>
<div class="deck-viewport">
  <main class="deck-stage" id="deckStage">
    <!-- === TITLE SLIDE === -->
    <section class="slide" aria-label="Приглашение">
      <div class="content">
        <div class="top reveal d1"><span class="pill">Приглашение</span><span class="edition">06 · 12 · 2026</span></div>
        <div class="solid draw d1" style="margin-top:44px"></div>
        <p class="eyebrow reveal d2" style="margin-top:56px">Обед в честь именинника</p>
        <h1 class="name reveal d3">Митьен</h1>
        <div class="age-row"><span class="age stamp">46</span><span class="age-note reveal d4">лет<br>за одним<br>столом</span></div>
        <p class="lead reveal d4">Зовёт тебя на день рождения: тёплая компания, вкусный обед и много тостов.</p>
        <div class="dash draw d4"></div>
        <div class="info reveal d5">
          <div><p class="k">Когда</p><p class="v">6 декабря</p><p class="s">воскресенье, 13:00</p></div>
          <div><p class="k">Где</p><p class="v">Мансарда</p><p class="s">ул. Лавочкина, 7А, стр. 1</p></div>
        </div>
        <div class="cta reveal">Ответить</div>
      </div>
    </section>
  </main>
</div>
<script>
/* === STAGE SCALE: вписываем сцену 1080×1920 в экран целиком === */
const stage = document.getElementById("deckStage");
function scale() {
  const f = Math.min(innerWidth / 1080, innerHeight / 1920);
  stage.style.transform = `translate(${(innerWidth - 1080 * f) / 2}px, ${(innerHeight - 1920 * f) / 2}px) scale(${f})`;
}
scale(); addEventListener("resize", scale);
const slide = document.querySelector(".slide");
slide.classList.add("active");
requestAnimationFrame(() => requestAnimationFrame(() => slide.classList.add("visible")));
</script>
</body>
</html>
