<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Митьен · 46 · 6 декабря</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Golos+Text:wght@500;600;800&display=swap" rel="stylesheet">
<style>
/* === THEME (Праздничный постер: ультрамарин + сливочное масло + розовый) === */
:root {
  --ultra: #1B2BD9; --ultra-dp: #101A9C; --butter: #FFE27A; --pink: #FF86A8; --cream: #FFF6E3; --ink: #0B1060;
  --stage-bg: #1B2BD9; --slide-bg: #1B2BD9;
  --font-display: "Dela Gothic One", sans-serif;
  --font-body: "Golos Text", sans-serif;
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
/* ===========================================
   FIXED STAGE: MANDATORY BASE STYLES (viewport-base.css)
   Сцена вертикальная 1080×1920 (по согласованию: приглашение смотрят с телефона).
   Слайды рисуются в 1080×1920 и масштабируются целиком.
   =========================================== */
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-viewport { position: fixed; inset: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; transform-origin: 0 0; background: var(--slide-bg, #fff); }
.slide { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; display: block; visibility: hidden; opacity: 0; pointer-events: none; background: var(--slide-bg, #fff); }
.slide.active, .slide.visible { visibility: visible; opacity: 1; pointer-events: auto; z-index: 1; }
img, video, canvas, svg { max-width: 100%; max-height: 100%; }
.deck-controls { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 1000; }
@media print {
  html, body { width: 1080px; height: auto; overflow: visible; background: #fff; }
  .deck-viewport { position: static; overflow: visible; background: #fff; }
  .deck-stage { position: static; width: auto; height: auto; transform: none !important; background: none; }
  .slide { position: relative; display: block !important; visibility: visible !important; opacity: 1 !important; pointer-events: auto !important; width: 1080px; height: 1920px; break-after: page; page-break-after: always; }
  .slide:last-child { break-after: auto; page-break-after: auto; }
  .deck-controls { display: none !important; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.2s !important; }
}


/* === BACKGROUND: солнечные лучи + зерно === */
.slide { background: radial-gradient(1200px 1100px at 50% 42%, #2A3CF0, var(--ultra) 55%, var(--ultra-dp)); }
.rays { position: absolute; left: 50%; top: 40%; width: 2600px; height: 2600px; margin: -1300px 0 0 -1300px; opacity: .14;
  background: repeating-conic-gradient(from 0deg, var(--cream) 0deg 6deg, transparent 6deg 18deg); animation: spin 90s linear infinite;
  -webkit-mask: radial-gradient(closest-side, #000 30%, transparent 75%); mask: radial-gradient(closest-side, #000 30%, transparent 75%); }
@keyframes spin { to { transform: rotate(360deg); } }

/* === BALLOONS === */
.balloon { position: absolute; bottom: -520px; width: 210px; height: 260px; animation: rise var(--dur, 9s) var(--delay, 0s) var(--ease-out-expo) forwards, sway 5s ease-in-out infinite alternate; }
.balloon .b { width: 210px; height: 250px; border-radius: 50% 50% 48% 52% / 55% 55% 45% 45%; background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.75), transparent 22%), var(--c); box-shadow: inset -22px -26px 0 rgba(0,0,0,.12); }
.balloon .b::after { content: ""; position: absolute; left: 50%; top: 244px; width: 26px; height: 18px; margin-left: -13px; background: var(--c); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.balloon svg { position: absolute; left: 50%; top: 260px; width: 60px; height: 300px; margin-left: -30px; overflow: visible; }
.balloon path { fill: none; stroke: rgba(255,246,227,.7); stroke-width: 3; }
@keyframes rise { to { transform: translateY(var(--to, -1500px)); } }
@keyframes sway { from { rotate: -5deg; } to { rotate: 5deg; } }

/* === CONTENT === */
.content { position: absolute; inset: 0; padding: 140px 80px 120px; display: flex; flex-direction: column; align-items: center; text-align: center; color: var(--cream); z-index: 2; }
.tag { display: inline-block; background: var(--butter); color: var(--ink); font: 800 34px/1 var(--font-body); letter-spacing: .14em; text-transform: uppercase; padding: 22px 36px; border-radius: 999px; transform: rotate(-3deg); }
.name { font: 400 168px/1 var(--font-display); margin-top: 90px; letter-spacing: -.01em; }
.age { position: relative; font: 400 490px/.9 var(--font-display); color: var(--butter); letter-spacing: -.05em; margin-right: 40px; margin-top: 10px; text-shadow: 16px 16px 0 var(--pink), 32px 32px 0 var(--ink); }
.sub { font: 600 52px/1.2 var(--font-body); margin-top: 40px; }
.sub b { color: var(--butter); }
.ticket { margin-top: auto; width: 100%; display: grid; grid-template-columns: 1fr 1fr; background: var(--cream); color: var(--ink); border-radius: 40px; overflow: hidden; position: relative; }
.ticket::before, .ticket::after { content: ""; position: absolute; left: 50%; width: 56px; height: 56px; margin-left: -28px; border-radius: 50%; background: var(--ultra-dp); }
.ticket::before { top: -28px; } .ticket::after { bottom: -28px; }
.ticket > div { padding: 46px 40px; text-align: left; }
.ticket > div + div { border-left: 4px dashed rgba(11,16,96,.25); }
.ticket .k { font: 800 26px/1 var(--font-body); letter-spacing: .16em; text-transform: uppercase; color: var(--pink); }
.ticket .v { font: 400 70px/1 var(--font-display); margin-top: 18px; }
.ticket .s { font: 600 30px/1.3 var(--font-body); margin-top: 12px; opacity: .75; }

/* === ANIMATIONS: пружинистый вход === */
.pop { opacity: 0; transform: scale(.4) rotate(-10deg); }
.slide.visible .pop { animation: pop .9s var(--spring) forwards; }
@keyframes pop { to { opacity: 1; transform: none; } }
.drop { opacity: 0; transform: translateY(-500px) rotate(-6deg); }
.slide.visible .drop { animation: drop 1.1s var(--spring) forwards; }
@keyframes drop { to { opacity: 1; transform: none; } }
.up { opacity: 0; transform: translateY(60px); }
.slide.visible .up { animation: up .9s var(--ease-out-expo) forwards; }
@keyframes up { to { opacity: 1; transform: none; } }
.slide.visible .age { animation: drop 1.1s .6s var(--spring) forwards, wobble 3s 2.4s ease-in-out infinite; }
@keyframes wobble { 0%, 100% { rotate: 0deg; } 50% { rotate: -2deg; } }
.tag.pop { animation-delay: .2s !important; } .name.up { animation-delay: .4s !important; } .sub.up { animation-delay: 1.3s !important; } .ticket.up { animation-delay: 1.6s !important; }
#confetti { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
</style>
</head>
<body>
<div class="deck-viewport">
  <main class="deck-stage" id="deckStage">
    <!-- === TITLE SLIDE === -->
    <section class="slide" aria-label="Приглашение">
      <div class="rays"></div>
      <div class="balloon" style="--c:#FF86A8;left:40px;--dur:7s;--delay:.2s;--to:-1650px"><div class="b"></div><svg viewBox="0 0 60 300"><path d="M30 0C10 60 50 120 30 180S20 260 30 300"/></svg></div>
      <div class="balloon" style="--c:#FFE27A;left:820px;--dur:8s;--delay:.5s;--to:-1500px"><div class="b"></div><svg viewBox="0 0 60 300"><path d="M30 0C50 60 10 120 30 180S40 260 30 300"/></svg></div>
      <div class="balloon" style="--c:#FFF6E3;left:700px;--dur:10s;--delay:1.2s;--to:-2400px;transform:scale(.7)"><div class="b"></div><svg viewBox="0 0 60 300"><path d="M30 0C10 60 50 120 30 180S20 260 30 300"/></svg></div>
      <div class="balloon" style="--c:#FF86A8;left:160px;--dur:11s;--delay:1.8s;--to:-2500px"><div class="b"></div><svg viewBox="0 0 60 300"><path d="M30 0C50 60 10 120 30 180S40 260 30 300"/></svg></div>
      <div class="content">
        <span class="tag pop">Тебя приглашают!</span>
        <h1 class="name up">Митьен</h1>
        <div class="age">46</div>
        <p class="sub up">празднует <b>день рождения</b></p>
        <div class="ticket up">
          <div><p class="k">Когда</p><p class="v">6.12</p><p class="s">воскресенье, 13:00</p></div>
          <div><p class="k">Где</p><p class="v">Мансарда</p><p class="s">ул. Лавочкина, 7А, стр. 1</p></div>
        </div>
      </div>
      <canvas id="confetti" width="1080" height="1920"></canvas>
    </section>
  </main>
</div>
<script>
/* === STAGE SCALE: вписываем сцену 1080×1920 в экран целиком === */
const stage = document.getElementById("deckStage");
function scale() {
  const f = Math.min(innerWidth / 1080, innerHeight / 1920);
  stage.style.transform = `translate(${(innerWidth - 1080 * f) / 2}px, ${(innerHeight - 1920 * f) / 2}px) scale(${f})`;
}
scale(); addEventListener("resize", scale);
const slide = document.querySelector(".slide");
slide.classList.add("active");
requestAnimationFrame(() => requestAnimationFrame(() => slide.classList.add("visible")));

/* === CONFETTI: залп при появлении «46» === */
(function () {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const ctx = document.getElementById("confetti").getContext("2d");
  const colors = ["#FFE27A", "#FF86A8", "#FFF6E3", "#7CE0C3", "#0B1060"];
  let parts = [];
  function burst(x, y, n) {
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + (Math.random() - .5) * 2.2, s = Math.random() * 38 + 18;
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, w: Math.random() * 26 + 14, h: Math.random() * 12 + 8, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: colors[i % colors.length] });
    }
  }
  setTimeout(() => { burst(250, 1000, 120); burst(830, 1000, 120); }, 1300);
  (function loop() {
    ctx.clearRect(0, 0, 1080, 1920);
    parts.forEach((p) => { p.vy += .9; p.vx *= .985; p.vy *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 2)) + 2); ctx.restore(); });
    parts = parts.filter((p) => p.y < 2100);
    requestAnimationFrame(loop);
  })();
})();
</script>
</body>
</html>
