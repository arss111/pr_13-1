<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Митьен · 46 · 6 декабря</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;0,600;1,300;1,400&family=IBM+Plex+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
/* === THEME (Dark Botanical) === */
:root {
  --bg-primary: #0f0f0f;
  --text-primary: #e8e4df;
  --text-secondary: #9a9590;
  --accent-warm: #d4a574;
  --accent-pink: #e8b4b8;
  --accent-gold: #c9b896;
  --stage-bg: #0f0f0f;
  --slide-bg: #0f0f0f;
  --font-display: "Cormorant", serif;
  --font-body: "IBM Plex Sans", sans-serif;
  --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
/* ===========================================
   FIXED STAGE: MANDATORY BASE STYLES (viewport-base.css)
   Сцена вертикальная 1080×1920 (по согласованию: приглашение смотрят с телефона).
   Слайды рисуются в 1080×1920 и масштабируются целиком.
   =========================================== */
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-viewport { position: fixed; inset: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; transform-origin: 0 0; background: var(--slide-bg, #fff); }
.slide { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; display: block; visibility: hidden; opacity: 0; pointer-events: none; background: var(--slide-bg, #fff); }
.slide.active, .slide.visible { visibility: visible; opacity: 1; pointer-events: auto; z-index: 1; }
img, video, canvas, svg { max-width: 100%; max-height: 100%; }
.deck-controls { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 1000; }
@media print {
  html, body { width: 1080px; height: auto; overflow: visible; background: #fff; }
  .deck-viewport { position: static; overflow: visible; background: #fff; }
  .deck-stage { position: static; width: auto; height: auto; transform: none !important; background: none; }
  .slide { position: relative; display: block !important; visibility: visible !important; opacity: 1 !important; pointer-events: auto !important; width: 1080px; height: 1920px; break-after: page; page-break-after: always; }
  .slide:last-child { break-after: auto; page-break-after: auto; }
  .deck-controls { display: none !important; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.2s !important; }
}


/* === SOFT BOTANICAL ORBS (размытые круги) === */
.orb { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0; animation: orbIn 2.4s var(--ease-out-expo) forwards, drift 16s ease-in-out infinite alternate; }
.orb.o1 { width: 760px; height: 760px; left: -300px; top: -220px; background: radial-gradient(circle, rgba(212,165,116,.55), transparent 70%); }
.orb.o2 { width: 680px; height: 680px; right: -280px; top: 520px; background: radial-gradient(circle, rgba(232,180,184,.42), transparent 70%); animation-delay: .3s, 0s; animation-duration: 2.4s, 19s; }
.orb.o3 { width: 820px; height: 820px; left: 60px; bottom: -420px; background: radial-gradient(circle, rgba(201,184,150,.35), transparent 70%); animation-delay: .6s, 0s; animation-duration: 2.4s, 22s; }
@keyframes orbIn { to { opacity: 1; } }
@keyframes drift { to { transform: translate(60px, 50px) scale(1.08); } }

/* === THIN VERTICAL LINES === */
.vline { position: absolute; top: 0; width: 1px; height: 100%; background: linear-gradient(transparent, rgba(201,184,150,.35) 30%, rgba(201,184,150,.35) 70%, transparent); transform: scaleY(0); transform-origin: top; animation: grow 2.2s .2s var(--ease-out-expo) forwards; }
.vline.l1 { left: 96px; } .vline.l2 { right: 96px; animation-delay: .45s; }
@keyframes grow { to { transform: scaleY(1); } }

/* === TITLE LAYOUT === */
.content { position: absolute; inset: 0; color: var(--text-primary); padding: 190px 150px 170px; display: flex; flex-direction: column; align-items: center; text-align: center; }
.kicker { font: 300 30px/1 var(--font-body); letter-spacing: .42em; text-transform: uppercase; color: var(--accent-gold); padding-left: .42em; }
.name { margin-top: 150px; font: italic 300 150px/1 var(--font-display); color: var(--text-primary); }
.age { font: 300 640px/.82 var(--font-display); margin-top: 10px; letter-spacing: -.02em;
  background: linear-gradient(170deg, #f3e3c8 10%, var(--accent-warm) 55%, #9c6f45 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.sub { margin-top: 30px; font: italic 400 64px/1.2 var(--font-display); color: var(--accent-pink); }
.rule { width: 160px; height: 1px; background: var(--accent-gold); margin: 70px auto 60px; }
.when { font: 400 76px/1.1 var(--font-display); }
.where { margin-top: 26px; font: 300 32px/1.5 var(--font-body); color: var(--text-secondary); letter-spacing: .04em; }
.swipe { position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%); font: 300 24px/1 var(--font-body); letter-spacing: .4em; text-transform: uppercase; color: var(--text-secondary); display: flex; flex-direction: column; align-items: center; gap: 20px; padding-left: .4em; }
.swipe i { width: 1px; height: 70px; background: linear-gradient(var(--accent-gold), transparent); animation: pulse 2.4s infinite; }
@keyframes pulse { 0%, 100% { opacity: .25; transform: scaleY(.6); transform-origin: top; } 50% { opacity: 1; transform: scaleY(1); } }

/* === ANIMATIONS: staggered reveal on .visible === */
.reveal { opacity: 0; transform: translateY(40px); transition: opacity 1.2s var(--ease-out-expo), transform 1.2s var(--ease-out-expo); }
.reveal-blur { opacity: 0; filter: blur(24px); transform: scale(1.08); transition: opacity 1.8s var(--ease-out-expo), filter 1.8s var(--ease-out-expo), transform 2.2s var(--ease-out-expo); }
.slide.visible .reveal, .slide.visible .reveal-blur { opacity: 1; transform: none; filter: none; }
.d1 { transition-delay: .3s; } .d2 { transition-delay: .7s; } .d3 { transition-delay: 1.1s; } .d4 { transition-delay: 1.6s; } .d5 { transition-delay: 1.9s; } .d6 { transition-delay: 2.2s; } .d7 { transition-delay: 2.8s; }
.slide.visible .rule { animation: widen 1.4s 1.8s var(--ease-out-expo) both; }
@keyframes widen { from { transform: scaleX(0); } to { transform: scaleX(1); } }
</style>
</head>
<body>
<div class="deck-viewport">
  <main class="deck-stage" id="deckStage">
    <!-- === TITLE SLIDE === -->
    <section class="slide" aria-label="Приглашение">
      <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
      <div class="vline l1"></div><div class="vline l2"></div>
      <div class="content">
        <p class="kicker reveal d1">Приглашение</p>
        <h1 class="name reveal d2">Митьен</h1>
        <div class="age reveal-blur d3">46</div>
        <p class="sub reveal d4">празднует день рождения</p>
        <div class="rule"></div>
        <p class="when reveal d5">6 декабря · 13:00</p>
        <p class="where reveal d6">Ресторан «Мансарда»<br>ул. Лавочкина, 7А, стр. 1</p>
      </div>
      <div class="swipe reveal d7">Листай<i></i></div>
    </section>
  </main>
</div>
<script>
/* === STAGE SCALE: вписываем сцену 1080×1920 в экран целиком === */
const stage = document.getElementById("deckStage");
function scale() {
  const f = Math.min(innerWidth / 1080, innerHeight / 1920);
  stage.style.transform = `translate(${(innerWidth - 1080 * f) / 2}px, ${(innerHeight - 1920 * f) / 2}px) scale(${f})`;
}
scale(); addEventListener("resize", scale);
const slide = document.querySelector(".slide");
slide.classList.add("active");
requestAnimationFrame(() => requestAnimationFrame(() => slide.classList.add("visible")));
</script>
</body>
</html>
