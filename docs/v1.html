<style>
:root {
  --bg: #08090d; --text: #f3ede2; --muted: #a39c8f; --accent: #e3c287;
  --line: rgba(227,194,135,.16); --line-strong: rgba(227,194,135,.45);
  --card-bg: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
  --input-bg: rgba(0,0,0,.32); --input-border: rgba(255,255,255,.1); --placeholder: #6f695f;
  --focus: rgba(227,194,135,.16); --choice-on: rgba(227,194,135,.09);
  --chip-on-bg: linear-gradient(180deg,#f6e3bb,#e3c287); --chip-on-text: #1b1408;
  --btn-bg: linear-gradient(180deg,#f8e8c4,#e3c287 55%,#b98f4e); --btn-text: #1b1408;
  --btn-shadow: 0 14px 34px -12px rgba(227,194,135,.65), inset 0 1px 0 rgba(255,255,255,.55);
  --danger: #e38787; --radius: 22px;
  --display: "Cormorant Garamond", Georgia, serif; --sans: "Manrope", system-ui, sans-serif;
}
.sky { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.sky i { position: absolute; border-radius: 50%; filter: blur(50px); animation: drift 18s ease-in-out infinite alternate; }
.sky .g1 { width: 80vmax; height: 55vmax; left: calc(50% - 40vmax); top: -32vmax; background: radial-gradient(closest-side, rgba(227,194,135,.30), transparent); }
.sky .g2 { width: 60vmax; height: 60vmax; right: -32vmax; top: 25vh; background: radial-gradient(closest-side, rgba(128,32,54,.55), transparent); animation-duration: 23s; }
.sky .g3 { width: 60vmax; height: 60vmax; left: -36vmax; top: 75vh; background: radial-gradient(closest-side, rgba(110,31,48,.45), transparent); animation-duration: 27s; }
@keyframes drift { to { transform: translate(5vw, 5vh) scale(1.12); } }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }

/* ---------- HERO ---------- */
.hero { min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 48px 0 170px; }
.moon { position: absolute; top: 9vh; right: 4px; width: 46px; height: 46px; border-radius: 50%;
  box-shadow: inset -9px 3px 0 0 #f6e3bb; transform: rotate(-20deg); filter: drop-shadow(0 0 14px rgba(246,227,187,.55));
  opacity: 0; animation: fadeIn 2.5s 2.2s forwards; }
.eyebrow-wrap { display: flex; align-items: center; gap: 14px; }
.eyebrow-wrap .ln { width: 60px; height: 1px; background: linear-gradient(90deg, transparent, var(--accent)); transform: scaleX(0); animation: grow 1.4s .3s forwards cubic-bezier(.2,.7,.2,1); transform-origin: right; }
.eyebrow-wrap .ln:last-child { transform-origin: left; background: linear-gradient(270deg, transparent, var(--accent)); }
.eyebrow { margin: 0; text-transform: uppercase; letter-spacing: .38em; font-size: 12px; color: var(--accent); opacity: 0; animation: fadeIn 1.2s .2s forwards; }
@keyframes grow { to { transform: scaleX(1); } }
@keyframes fadeIn { to { opacity: 1; } }

.age-svg { width: min(92vw, 440px); height: auto; margin: 4px 0 -6px; overflow: visible; }
.age-svg text { font-family: var(--display); font-weight: 300; font-size: 300px; }
.age-stroke { fill: none; stroke: #e3c287; stroke-width: 1.2; stroke-dasharray: 1400; stroke-dashoffset: 1400; }
.age-fill { opacity: 0; }
.age-glow { opacity: 0; filter: blur(18px); }
.ready .age-stroke { animation: drawAge 2.4s .3s cubic-bezier(.6,0,.3,1) forwards, fadeStroke 1s 2.6s forwards; }
.ready .age-fill { animation: fadeIn 1.6s 1.6s forwards; }
.ready .age-glow { animation: glow 4s 2s ease-in-out infinite alternate; }
.age-shine { transform: translateX(-260px) skewX(-20deg); }
.ready .age-shine { animation: sweep 6s 3.2s cubic-bezier(.5,0,.3,1) infinite; }
@keyframes drawAge { to { stroke-dashoffset: 0; } }
@keyframes fadeStroke { to { opacity: .0; } }
@keyframes glow { from { opacity: .18; } to { opacity: .4; } }
@keyframes sweep { 0% { transform: translateX(-260px) skewX(-20deg); } 35%, 100% { transform: translateX(560px) skewX(-20deg); } }

.hero-title { font-family: var(--display); font-style: italic; font-size: clamp(36px, 9vw, 50px); line-height: 1.1; }
.hero-title .ch { display: inline-block; opacity: 0; transform: translateY(.5em) rotate(6deg); filter: blur(6px); }
.ready .hero-title .ch { animation: chIn .9s cubic-bezier(.2,.7,.2,1) forwards; animation-delay: calc(1.9s + var(--i) * 55ms); }
@keyframes chIn { to { opacity: 1; transform: none; filter: none; } }
.hero-sub { color: var(--muted); margin: 8px 0 0; opacity: 0; }
.ready .hero-sub { animation: fadeIn 1s 2.6s forwards; }

.date-badge { margin-top: 30px; display: inline-flex; align-items: center; gap: 12px; padding: 13px 24px;
  border: 1px solid var(--line-strong); border-radius: 999px; font-family: var(--display); font-size: 23px;
  background: rgba(8,9,13,.45); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); opacity: 0; transform: translateY(14px); }
.date-badge .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
.place-line { margin-top: 14px; color: var(--muted); font-size: 14px; letter-spacing: .06em; opacity: 0; }
.hero .cta { margin-top: 30px; opacity: 0; transform: translateY(14px); }
.ready .date-badge { animation: up 1s 2.7s cubic-bezier(.2,.7,.2,1) forwards; }
.ready .place-line { animation: fadeIn 1s 3s forwards; }
.hero.ready .cta { animation: up 1s 3.1s cubic-bezier(.2,.7,.2,1) forwards; }
@keyframes up { to { opacity: 1; transform: none; } }

.skyline-wrap { position: absolute; left: 50%; bottom: 0; width: 100vw; max-width: 1200px; transform: translateX(-50%); height: 150px; pointer-events: none; }
.skyline { position: absolute; inset: 0; width: 100%; height: 100%; color: #050608; }
.skyline .win { fill: #f1cf8c; opacity: 0; }
.ready .skyline .win { animation: lightOn .5s forwards, flicker 7s infinite; animation-delay: var(--t), calc(var(--t) + 2s); }
@keyframes lightOn { to { opacity: .9; } }
@keyframes flicker { 0%, 46%, 54%, 100% { opacity: .9; } 50% { opacity: .3; } }
.skyline .mw { fill: #fff0cf; opacity: 0; }
.skyline .halo { fill: url(#halo); opacity: 0; }
.ready .skyline .mw { animation: lightOn 1.2s 3.4s forwards; }
.ready .skyline .halo { animation: halo 3s 3.6s ease-in-out infinite alternate; }
@keyframes halo { from { opacity: .55; } to { opacity: 1; } }
.ground { position: absolute; left: 0; right: 0; bottom: -100px; height: 100px; background: linear-gradient(#050608, rgba(5,6,8,0)); }
.scroll-cue { position: absolute; bottom: 168px; left: 50%; transform: translateX(-50%); width: 22px; height: 34px; border: 1.5px solid var(--line-strong); border-radius: 12px; opacity: 0; }
.scroll-cue::after { content: ""; position: absolute; left: 50%; top: 7px; width: 3px; height: 7px; margin-left: -1.5px; border-radius: 2px; background: var(--accent); animation: wheel 2s infinite; }
.ready .scroll-cue { animation: fadeIn 1s 4s forwards; }
@keyframes wheel { 0% { transform: translateY(0); opacity: 1; } 70% { transform: translateY(10px); opacity: 0; } 100% { opacity: 0; } }

/* ---------- Секции ---------- */
.quote { text-align: center; margin: 90px auto 0; max-width: 34ch; }
.quote .mark { font-family: var(--display); font-size: 90px; line-height: .5; color: var(--accent); opacity: .5; display: block; height: 40px; }
.quote p { font-family: var(--display); font-style: italic; font-size: clamp(22px, 5.4vw, 27px); line-height: 1.45; margin: 0; }
.section-head { text-align: center; margin: 76px 0 24px; }
.section-head .eyebrow { opacity: 1; animation: none; }
.section-head h2 { font-family: var(--display); font-size: clamp(34px, 8vw, 44px); margin-top: 6px; }
.section-head h2::after { content: ""; display: block; width: 60px; height: 1px; margin: 14px auto 0; background: var(--accent); transform: scaleX(0); transition: transform 1.2s .4s cubic-bezier(.2,.7,.2,1); }
.section-head.in h2::after { transform: scaleX(1); }
.card { position: relative; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 30px 60px -40px rgba(0,0,0,.8); }
.card::before { content: ""; position: absolute; top: -1px; left: 18%; right: 18%; height: 1px; background: linear-gradient(90deg, transparent, #f6e3bb, transparent); transform: scaleX(0); transition: transform 1.4s .35s cubic-bezier(.2,.7,.2,1); }
.card.in::before, .thanks::before { transform: scaleX(1); }
.countdown .num { color: #f6e3bb; }
.thanks.pop { animation: popIn .8s cubic-bezier(.2,.8,.2,1.2); }
@keyframes popIn { from { opacity: 0; transform: scale(.9); } }
footer { text-align: center; margin-top: 70px; color: var(--muted); font-size: 13px; }
footer .sig { font-family: var(--display); font-style: italic; font-size: 30px; color: var(--accent); }
@media (max-width: 380px) { .date-badge { font-size: 20px; padding: 11px 18px; } }
</style>
</head>
<body>
<div class="demo-banner" id="demoBanner" hidden>Демо-режим: ответы сохраняются только в этом браузере</div>
<div class="sky" aria-hidden="true"><i class="g1"></i><i class="g2"></i><i class="g3"></i></div>
<canvas id="fx" aria-hidden="true"></canvas>

<main>
  <section class="hero" id="hero">
    <div class="moon" aria-hidden="true"></div>
    <div class="eyebrow-wrap"><span class="ln"></span><p class="eyebrow">Приглашение</p><span class="ln"></span></div>
    <svg class="age-svg" id="ageSvg" viewBox="0 0 440 280" role="img" aria-label="46">
      <defs>
        <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fff4d8"/><stop offset=".45" stop-color="#e3c287"/><stop offset="1" stop-color="#a47838"/>
        </linearGradient>
        <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
        <mask id="ageMask"><text x="220" y="246" text-anchor="middle" fill="#fff">46</text></mask>

      <text class="age-fill" x="220" y="246" text-anchor="middle" fill="url(#gold)">46</text>
      <text class="age-stroke" x="220" y="246" text-anchor="middle">46</text>
      <g mask="url(#ageMask)"><rect class="age-shine" x="0" y="0" width="110" height="280" fill="url(#shine)"/></g>
    </svg>
    <h1 class="hero-title" id="heroTitle">день рождения</h1>
    <p class="hero-sub" id="heroSub"></p>
    <div class="date-badge"><span id="badgeDate">6 декабря</span><span class="dot"></span><span id="badgeWeekday">воскресенье</span></div>

    <a class="btn cta" href="#rsvp">Ответить на приглашение</a>

    <div class="skyline-wrap" id="skyline" aria-hidden="true">
      <svg class="skyline" viewBox="0 0 1200 150" preserveAspectRatio="xMidYMax slice">
        <defs><radialGradient id="halo"><stop offset="0" stop-color="#ffd98f" stop-opacity=".55"/><stop offset="1" stop-color="#ffd98f" stop-opacity="0"/></radialGradient></defs>
        <g fill="currentColor" id="bld">
          <rect x="0" y="86" width="70" height="64"/><rect x="60" y="60" width="58" height="90"/>
          <rect x="112" y="94" width="80" height="56"/><polygon points="190,150 190,72 220,52 250,72 250,150"/>
          <rect x="248" y="80" width="90" height="70"/><rect x="330" y="46" width="44" height="104"/>
          <rect x="370" y="88" width="80" height="62"/><rect x="446" y="68" width="70" height="82"/>
          <rect x="512" y="78" width="176" height="72"/><polygon points="500,80 534,30 666,30 700,80"/>
          <rect x="640" y="12" width="12" height="24"/>
          <rect x="686" y="84" width="70" height="66"/><rect x="750" y="56" width="54" height="94"/>
          <polygon points="800,150 800,76 836,42 872,76 872,150"/><rect x="868" y="90" width="86" height="60"/>
          <rect x="950" y="64" width="64" height="86"/><rect x="1010" y="94" width="80" height="56"/>
          <rect x="1086" y="72" width="60" height="78"/><rect x="1140" y="88" width="60" height="62"/>
        </g>
        <ellipse class="halo" cx="600" cy="54" rx="120" ry="48"/>
        <rect class="mw" x="550" y="42" width="18" height="26" rx="9"/>
        <rect class="mw" x="591" y="42" width="18" height="26" rx="9"/>
        <rect class="mw" x="632" y="42" width="18" height="26" rx="9"/>
        <g id="wins"></g>
      </svg>
      <div class="ground"></div>
    </div>
  </section>

  <section class="quote reveal"><span class="mark">“</span><p id="message"></p></section>

  <div class="section-head reveal"><p class="eyebrow">Детали</p><h2>Где и когда</h2></div>

  <div class="section-head reveal"><p class="eyebrow">До праздника</p><h2>Осталось</h2></div>

  <div class="section-head reveal" id="rsvp"><p class="eyebrow">Ваш ответ</p><h2 id="rsvpTitle">Вы придёте?</h2></div>

  <footer class="reveal"><div class="sig">До встречи 6 декабря!</div><p id="contactLine" hidden></p></footer>
</main>

<script>window.INVITE_THEME = { confetti: ["#fff4d8", "#f1d9a6", "#e3c287", "#b98f4e", "#ffffff", "#a8384f"] };</script>
<script src="app.js"></script>
<script>
(function () {
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  // Буквы заголовка по одной
  const t = document.getElementById("heroTitle");
  const txt = t.textContent; t.textContent = ""; t.setAttribute("aria-label", txt);
  [...txt].forEach((c, i) => { const s = document.createElement("span"); s.className = "ch"; s.style.setProperty("--i", i); s.textContent = c === " " ? " " : c; s.setAttribute("aria-hidden", "true"); t.appendChild(s); });

  // Окна в домах загораются по очереди
  const wins = document.getElementById("wins"), NS = "http://www.w3.org/2000/svg";
  [[72,74],[98,90],[86,110],[130,108],[160,118],[214,84],[268,96],[300,110],[344,62],[344,90],[356,120],[392,104],[420,118],[466,84],[490,110],[540,96],[600,112],[650,96],[668,124],[706,100],[730,120],[766,70],[784,100],[830,90],[846,118],[890,104],[920,120],[976,80],[992,110],[1030,108],[1060,124],[1104,90],[1120,116],[1160,104]]
    .forEach(([x, y], i) => {
      const r = document.createElementNS(NS, "rect");
      r.setAttribute("class", "win"); r.setAttribute("x", x); r.setAttribute("y", y); r.setAttribute("width", 6); r.setAttribute("height", 8);
      r.style.setProperty("--t", (0.6 + Math.random() * 2.6).toFixed(2) + "s");
      if (Math.random() < 0.3) r.style.display = "none";
      wins.appendChild(r);
    });

  const start = () => document.getElementById("hero").classList.add("ready");
  (document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 1500))]) : Promise.resolve()).then(start);

  // Параллакс
  const sky = document.getElementById("skyline"), age = document.getElementById("ageSvg");
  let ticking = false;
  addEventListener("scroll", () => {
    if (ticking || reduced) return; ticking = true;
    requestAnimationFrame(() => {
      const y = scrollY;
      if (y < innerHeight * 1.2) {
        sky.style.transform = `translateX(-50%) translateY(${y * 0.18}px)`;
        age.style.transform = `translateY(${y * 0.32}px)`;
        age.style.opacity = Math.max(0, 1 - y / (innerHeight * 0.8));
      }
      ticking = false;
    });
  }, { passive: true });

  // Золотая пыль и снег
  if (reduced) return;
  const cv = document.getElementById("fx"), ctx = cv.getContext("2d");
  let w, h, snow, bokeh;
  function resize() {
    const dpr = Math.min(2, devicePixelRatio || 1);
    w = innerWidth; h = innerHeight; cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    snow = Array.from({ length: Math.round(Math.min(110, w * h / 9000)) }, () => ({
      x: Math.random() * w, y: Math.random() * h, r: Math.random() * 1.7 + .3, s: Math.random() * .6 + .25, d: Math.random() * 6.3, o: Math.random() * .55 + .2 }));
    bokeh = Array.from({ length: 12 }, () => ({
      x: Math.random() * w, y: Math.random() * h, r: Math.random() * 26 + 10, vx: (Math.random() - .5) * .15, vy: -(Math.random() * .2 + .05), o: Math.random() * .12 + .04, p: Math.random() * 6.3 }));
  }
  resize(); addEventListener("resize", resize);
  let f = 0;
  (function loop() {
    ctx.clearRect(0, 0, w, h); f++;
    bokeh.forEach((b) => {
      b.x += b.vx; b.y += b.vy; if (b.y < -40) { b.y = h + 40; b.x = Math.random() * w; }
      const o = b.o * (0.7 + 0.3 * Math.sin(f / 60 + b.p));
      const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
      g.addColorStop(0, `rgba(241,207,140,${o})`); g.addColorStop(1, "rgba(241,207,140,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();
    });
    snow.forEach((s) => {
      s.y += s.s; s.d += .012; s.x += Math.sin(s.d) * .35;
      if (s.y > h + 4) { s.y = -4; s.x = Math.random() * w; }
      ctx.fillStyle = `rgba(250,236,210,${s.o})`; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill();
    });
    requestAnimationFrame(loop);
  })();
})();
</script>
