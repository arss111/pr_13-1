<style>
:root {
  --bg: #0a0a0a; --text: #efe6d2; --muted: #9b917f; --accent: #d9b779; --accent-2: #f3e2b8;
  --line: rgba(217,183,121,.22); --line-strong: rgba(217,183,121,.55);
  --card-bg: linear-gradient(180deg, rgba(217,183,121,.07), rgba(217,183,121,.015));
  --input-bg: rgba(255,255,255,.03); --input-border: rgba(217,183,121,.22); --placeholder: #6d665a;
  --focus: rgba(217,183,121,.15); --choice-on: rgba(217,183,121,.1);
  --chip-on-bg: linear-gradient(180deg,#f3e2b8,#d9b779); --chip-on-text: #15110a;
  --btn-bg: linear-gradient(180deg,#f5e6c0,#d9b779 50%,#a9884c); --btn-text: #15110a; --btn-radius: 0;
  --btn-shadow: none;
  --danger: #e08c7c; --radius: 0;
  --display: "Forum", Georgia, serif; --deco: "Poiret One", "Forum", sans-serif; --sans: "Manrope", system-ui, sans-serif;
}
body { background: radial-gradient(60rem 50rem at 50% 20%, #17140e, #0a0a0a 60%) fixed, #0a0a0a; }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }

/* ---------- HERO ---------- */
.hero { min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 0 48px; overflow: visible; }
.bleed { position: absolute; top: 0; bottom: 0; left: 50%; width: 100vw; transform: translateX(-50%); overflow: hidden; pointer-events: none; z-index: -1; }
.rays { position: absolute; left: 50%; top: 46%; width: 900px; height: 900px; margin: -450px 0 0 -450px; pointer-events: none; z-index: -1; opacity: 0;
  -webkit-mask: radial-gradient(closest-side, #000 20%, transparent 100%); mask: radial-gradient(closest-side, #000 20%, transparent 100%); }
.rays svg { width: 100%; height: 100%; animation: spin 140s linear infinite; }
.rays line { stroke: var(--accent); stroke-width: 1; opacity: .22; }
.go .rays { animation: fadeIn 2.5s forwards; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadeIn { to { opacity: 1; } }

.frame { position: relative; width: min(92vw, 400px); aspect-ratio: 340 / 470; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 18% 9% 16%; }
.frame > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.frame path, .frame line, .frame circle { fill: none; stroke: var(--accent); stroke-width: 1.1; stroke-dasharray: 1; stroke-dashoffset: 1; }
.frame .thin { stroke-width: .7; opacity: .7; }
.frame .dia { fill: var(--accent); stroke: none; opacity: 0; }
.go .frame path, .go .frame line, .go .frame circle { animation: draw 2.4s cubic-bezier(.6,0,.3,1) forwards; animation-delay: var(--t, .2s); }
.go .frame .dia { animation: fadeIn .6s 2.2s forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }

.eyebrow { margin: 0; font-family: var(--sans); font-size: 11px; letter-spacing: .5em; padding-left: .5em; text-transform: uppercase; color: var(--accent); opacity: 0; }
.go .eyebrow { animation: fadeIn 1.2s 1.2s forwards; }
.age { position: relative; font-family: var(--deco); font-size: clamp(130px, 40vw, 172px); line-height: .95; margin: 8px 0 0;
  background: linear-gradient(180deg, #fff4d6 0%, #e9cf97 40%, #b38f50 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  clip-path: inset(100% 0 0 0); filter: drop-shadow(0 0 24px rgba(217,183,121,.25)); }
.go .age { animation: wipe 1.4s 1.5s cubic-bezier(.7,0,.2,1) forwards; }
@keyframes wipe { to { clip-path: inset(-10% 0 -10% 0); } }
.age-shine { position: absolute; inset: 0; pointer-events: none; font: inherit; color: transparent;
  background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,.9) 50%, transparent 60%); background-size: 300% 100%; background-position: 150% 0;
  -webkit-background-clip: text; background-clip: text; }
.go .age-shine { animation: shineText 5s 3.4s ease-in-out infinite; }
@keyframes shineText { 0% { background-position: 150% 0; } 40%, 100% { background-position: -50% 0; } }
.title { font-family: var(--deco); font-size: clamp(22px, 6.4vw, 30px); text-transform: uppercase; letter-spacing: 1.2em; padding-left: 1.2em; opacity: 0; white-space: nowrap; margin-top: 4px; }
.go .title { animation: track 1.8s 2.3s cubic-bezier(.2,.7,.2,1) forwards; }
@keyframes track { to { letter-spacing: .22em; padding-left: .22em; opacity: 1; } }
.hero-sub { color: var(--muted); font-size: 14px; margin: 6px 0 0; opacity: 0; }
.go .hero-sub { animation: fadeIn 1s 2.8s forwards; }
.deco-div { display: flex; align-items: center; gap: 8px; margin: 18px 0 14px; opacity: 0; }
.deco-div span { height: 1px; width: 46px; background: var(--accent); }
.deco-div i { width: 8px; height: 8px; transform: rotate(45deg); border: 1px solid var(--accent); }
.deco-div i.f { background: var(--accent); width: 5px; height: 5px; }
.go .deco-div { animation: fadeIn 1s 2.8s forwards; }
.date { font-family: var(--display); font-size: clamp(24px, 7vw, 30px); line-height: 1.1; opacity: 0; }
.date small { display: block; font-family: var(--sans); font-size: 11px; letter-spacing: .4em; padding-left: .4em; text-transform: uppercase; color: var(--muted); margin-top: 8px; }
.date small.pl { margin-top: 4px; }
.go .date { animation: up 1s 3s cubic-bezier(.2,.7,.2,1) forwards; }
.hero .cta { margin-top: 28px; opacity: 0; transform: translateY(14px); }
.hero.go .cta { animation: up 1s 3.4s cubic-bezier(.2,.7,.2,1) forwards; }
@keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* ---------- Кнопки ар-деко ---------- */
.btn:not(.btn-ghost) { clip-path: polygon(14px 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 14px 100%, 0 50%); padding: 18px 40px; letter-spacing: .2em; text-transform: uppercase; font-size: 13px; }
.btn-ghost { letter-spacing: .08em; }

/* ---------- Секции ---------- */
.quote { text-align: center; margin: 60px auto 0; max-width: 32ch; }
.quote p { font-family: var(--display); font-size: clamp(21px, 5.2vw, 25px); line-height: 1.5; margin: 0; }
.section-head { text-align: center; margin: 76px 0 24px; }
.section-head .eyebrow { opacity: 1; animation: none; }
.section-head h2 { font-family: var(--deco); font-size: clamp(30px, 8vw, 40px); text-transform: uppercase; letter-spacing: .14em; margin-top: 8px; }
.section-head .deco-div { justify-content: center; opacity: 1; animation: none; margin: 14px 0 0; }
.section-head .deco-div span { transform: scaleX(0); transition: transform 1.2s .3s cubic-bezier(.2,.7,.2,1); }
.section-head .deco-div span:first-child { transform-origin: right; } .section-head .deco-div span:last-child { transform-origin: left; }
.section-head.in .deco-div span { transform: scaleX(1); }
.card { position: relative; }
.card::before { content: ""; position: absolute; inset: 5px; pointer-events: none; opacity: .9;
  background:
    linear-gradient(var(--accent), var(--accent)) left top / 16px 1px no-repeat, linear-gradient(var(--accent), var(--accent)) left top / 1px 16px no-repeat,
    linear-gradient(var(--accent), var(--accent)) right top / 16px 1px no-repeat, linear-gradient(var(--accent), var(--accent)) right top / 1px 16px no-repeat,
    linear-gradient(var(--accent), var(--accent)) left bottom / 16px 1px no-repeat, linear-gradient(var(--accent), var(--accent)) left bottom / 1px 16px no-repeat,
    linear-gradient(var(--accent), var(--accent)) right bottom / 16px 1px no-repeat, linear-gradient(var(--accent), var(--accent)) right bottom / 1px 16px no-repeat; }
.detail .value { font-family: var(--display); }
.detail .label, .countdown .cap { color: var(--accent); opacity: .85; }
.countdown .num { font-family: var(--deco); color: var(--accent-2); }
input[type="text"], textarea, .choice > span, .stepper { border-radius: 0; }
.chip span { border-radius: 0; }
.choice > span::before { border-radius: 0; transform: rotate(45deg) scale(.8); }
.choice input:checked + span::before { background: var(--accent); box-shadow: inset 0 0 0 4px #0a0a0a; }
.stepper button { border-radius: 0; }
.thanks.pop { animation: popIn .8s cubic-bezier(.2,.8,.2,1.2); }
@keyframes popIn { from { opacity: 0; transform: scale(.9); } }
.thanks h2 { font-family: var(--deco); text-transform: uppercase; letter-spacing: .08em; font-size: 32px; }
footer { text-align: center; margin-top: 70px; color: var(--muted); font-size: 13px; }
footer .sig { font-family: var(--deco); font-size: 26px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
</style>
</head>
<body>
<div class="demo-banner" id="demoBanner" hidden>Демо-режим: ответы сохраняются только в этом браузере</div>
<canvas id="fx" aria-hidden="true"></canvas>

<main>
  <section class="hero" id="hero">
    <div class="bleed" aria-hidden="true"><div class="rays"><svg viewBox="-450 -450 900 900" id="rays"></svg></div></div>
    <div class="frame">
      <svg viewBox="0 0 340 470" aria-hidden="true">
        <path pathLength="1" d="M40 6H300V18H322V40H334V430H322V452H300V464H40V452H18V430H6V40H18V18H40Z"/>
        <path class="thin" pathLength="1" style="--t:.5s" d="M46 14H294V26H314V46H326V424H314V444H294V456H46V444H26V424H14V46H26V26H46Z"/>
        <path pathLength="1" style="--t:.9s" d="M100 26A70 70 0 0 0 240 26"/>
        <path class="thin" pathLength="1" style="--t:1s" d="M122 26A48 48 0 0 0 218 26"/>

        <line pathLength="1" style="--t:1.2s" x1="14" y1="235" x2="40" y2="235"/>

  <section class="quote reveal"><p id="message"></p></section>

  <div class="section-head reveal"><p class="eyebrow">До праздника</p><h2>Осталось</h2><div class="deco-div"><span></span><i></i><span></span></div></div>

<script src="config.js"></script>
<script>window.INVITE_THEME = { confetti: ["#f5e6c0", "#d9b779", "#a9884c", "#ffffff", "#2a2a2a"] };</script>
<script src="app.js"></script>
<script>
(function () {
  const NS = "http://www.w3.org/2000/svg", reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  // Лучи за рамкой
  const rays = document.getElementById("rays");
  for (let i = 0; i < 72; i++) {
    const a = (i / 72) * Math.PI * 2, l = document.createElementNS(NS, "line");
    l.setAttribute("x1", Math.cos(a) * 60); l.setAttribute("y1", Math.sin(a) * 60);
    l.setAttribute("x2", Math.cos(a) * 450); l.setAttribute("y2", Math.sin(a) * 450);
    if (i % 2) l.style.opacity = .1;
    rays.appendChild(l);
  }
  // Веер вверху рамки
  const fan = document.getElementById("fanTop");
  for (let i = 1; i < 10; i++) {
    const a = Math.PI * (i / 10), l = document.createElementNS(NS, "line");
    l.setAttribute("x1", 170 + Math.cos(a) * 26); l.setAttribute("y1", 26 + Math.sin(a) * 26);
    l.setAttribute("x2", 170 + Math.cos(a) * 70); l.setAttribute("y2", 26 + Math.sin(a) * 70);
    l.setAttribute("pathLength", 1); l.setAttribute("class", "thin"); l.style.setProperty("--t", (1.2 + i * .06).toFixed(2) + "s");
    fan.appendChild(l);
  }
  const C = window.INVITE || {};
  if (C.name) document.getElementById("heroTitle").style.letterSpacing = ".1em";
  const go = () => document.getElementById("hero").classList.add("go");
  (document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 1500))]) : Promise.resolve()).then(go);

  // Пузырьки шампанского
  if (reduced) return;
  const cv = document.getElementById("fx"), ctx = cv.getContext("2d");
  let w, h, bs = [];
  function resize() {
    const dpr = Math.min(2, devicePixelRatio || 1);
    w = innerWidth; h = innerHeight; cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize(); addEventListener("resize", resize);
  const spawn = (y) => ({ x: Math.random() * w, y: y != null ? y : h + 10, r: Math.random() * 3 + 1, vy: Math.random() * .6 + .35, d: Math.random() * 6.3, a: Math.random() * .5 + .25 });
  for (let i = 0; i < 40; i++) bs.push(spawn(Math.random() * h));
  (function loop() {
    ctx.clearRect(0, 0, w, h);
    if (bs.length < Math.min(70, w * h / 9000) && Math.random() < .3) bs.push(spawn());
    bs.forEach((b) => {
      b.vy *= 1.002; b.y -= b.vy; b.d += .04; b.x += Math.sin(b.d) * .35;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7);
      ctx.strokeStyle = `rgba(243,226,184,${b.a})`; ctx.lineWidth = .8; ctx.stroke();
      ctx.beginPath(); ctx.arc(b.x - b.r * .35, b.y - b.r * .35, b.r * .3, 0, 7);
      ctx.fillStyle = `rgba(255,255,255,${b.a})`; ctx.fill();
    });
    bs = bs.filter((b) => b.y > -10);
    requestAnimationFrame(loop);
  })();
})();
</script>
